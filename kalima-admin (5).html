<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إدارة درس الكلمة الطيبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1F4D3D;
    --green-mid: #2E6E57;
    --gold: #B8925A;
    --cream: #FAF6EE;
    --card: #FFFFFF;
    --ink: #1E211F;
    --ink-soft: #5B655F;
    --line: #E4DFD2;
    --danger: #A6412F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Cairo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  header.top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .mark {
    width: 46px;
    height: 46px;
    flex: none;
    border-radius: 12px;
    background: linear-gradient(160deg, var(--green-deep), var(--green-mid));
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark svg { width: 24px; height: 24px; }
  header.top h1 {
    font-size: 19px;
    font-weight: 800;
    margin: 0 0 2px;
    color: var(--green-deep);
  }
  header.top p {
    margin: 0;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(31,77,61,0.04);
  }
  .card h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--green-deep);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2::before {
    content: "";
    width: 4px;
    height: 16px;
    background: var(--gold);
    border-radius: 2px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="date"], input[type="time"], select, textarea {
    width: 100%;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: #FCFAF5;
    color: var(--ink);
    resize: vertical;
    transition: border-color .15s ease;
  }
  input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--green-mid);
    background: #fff;
  }
  textarea { min-height: 78px; line-height: 1.5; }
  select { -webkit-appearance: none; appearance: none; cursor: pointer; }
  .toggle-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding: 12px 14px;
    background: #F4F0E4;
    border-radius: 10px;
  }
  .toggle-row input { accent-color: var(--green-mid); width: 18px; height: 18px; }
  .toggle-row span { font-size: 13.5px; color: var(--ink); }
  button.primary {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 15.5px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(160deg, var(--green-mid), var(--green-deep));
    border: none;
    border-radius: 11px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  .status {
    margin-top: 12px;
    font-size: 13.5px;
    padding: 10px 12px;
    border-radius: 8px;
    display: none;
  }
  .status.show { display: block; }
  .status.ok { background: #E6F0EA; color: var(--green-deep); }
  .status.err { background: #F6E7E3; color: var(--danger); }

  .lesson-item {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .lesson-item:last-child { margin-bottom: 0; }
  .lesson-info { flex: 1; min-width: 0; }
  .lesson-title { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
  .lesson-meta { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.active { background: #E6F0EA; color: var(--green-deep); }
  .badge.off { background: #EFEBDF; color: var(--ink-soft); }
  .deactivate-btn {
    font-family: 'Cairo', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--danger);
    background: none;
    border: 1px solid #E3C9C2;
    border-radius: 8px;
    padding: 5px 10px;
    cursor: pointer;
    margin-top: 6px;
    white-space: nowrap;
  }
  .deactivate-btn.activate-btn {
    color: var(--green-deep);
    border-color: #B9D6C8;
  }
  .lesson-col { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .empty-note { font-size: 13px; color: var(--ink-soft); text-align: center; padding: 10px 0; }
  .note {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L4 8v3h16V8l-8-6z" fill="#F5EFDD"/>
        <path d="M6 11v9h3v-6h6v6h3v-9" stroke="#F5EFDD" stroke-width="1.4" fill="none"/>
      </svg>
    </div>
    <div>
      <h1>لجنة الكلمة الطيبة</h1>
      <p>إدارة درس ومحاضرة هذا الأسبوع</p>
    </div>
  </header>

  <div class="card">
    <h2>إضافة درس جديد</h2>

    <label for="title">عنوان الدرس / المحاضرة</label>
    <input type="text" id="title" placeholder="مثال: كيف نحمي الفطرة؟">

    <label for="presenter">اسم الملقي (اختياري)</label>
    <input type="text" id="presenter" placeholder="مثال: د. علي بن راشد الوسمي">

    <label for="lessonDate">نوع الجدولة</label>
    <select id="scheduleType">
      <option value="recurring">متكرر أسبوعياً (مثل: كل اثنين)</option>
      <option value="specific">تاريخ محدد (محاضرة لمرة واحدة)</option>
    </select>

    <div id="recurringFields">
      <label for="weekday">اليوم</label>
      <select id="weekday">
        <option value="الأحد">الأحد</option>
        <option value="الاثنين">الاثنين</option>
        <option value="الثلاثاء">الثلاثاء</option>
        <option value="الأربعاء">الأربعاء</option>
        <option value="الخميس">الخميس</option>
        <option value="الجمعة">الجمعة</option>
        <option value="السبت">السبت</option>
      </select>
    </div>

    <div id="specificFields" style="display:none;">
      <label for="lessonDate">التاريخ</label>
      <input type="date" id="lessonDate">
    </div>

    <label for="timeOption">الوقت</label>
    <select id="timeOption">
      <option value="fajr">بعد صلاة الفجر</option>
      <option value="dhuhr">بعد صلاة الظهر</option>
      <option value="asr">بعد صلاة العصر</option>
      <option value="maghrib" selected>بعد صلاة المغرب</option>
      <option value="isha">بعد صلاة العشاء</option>
      <option value="custom">وقت محدد…</option>
    </select>
    <input type="time" id="customTime" style="display:none; margin-top:8px;">

    <label for="location">المكان</label>
    <input type="text" id="location" placeholder="مثال: مسجد الحساوي والخشتي، العيون ق1">

    <label for="mapsLink">رابط الموقع (اختياري)</label>
    <input type="text" id="mapsLink" placeholder="رابط خرائط جوجل">

    <div class="toggle-row">
      <input type="checkbox" id="deactivateOld" checked>
      <span>إيقاف عرض الدروس السابقة تلقائياً عند الحفظ</span>
    </div>

    <button class="primary" id="saveBtn" type="button">حفظ ونشر الدرس</button>
    <div class="status" id="statusBox"></div>
  </div>

  <div class="card">
    <h2>الدروس الحالية</h2>
    <div id="lessonsList"><div class="empty-note">جاري التحميل…</div></div>
    <p class="note">الدروس الموسومة بـ "منشور" هي التي يعرضها البوت حالياً للمستفيدين.</p>
  </div>

</div>

<script>
const SUPABASE_URL = "https://xldkuzyoalbjcufenzvu.supabase.co";
const SUPABASE_KEY = "sb_publishable_RMdknS1hTpE_l785Ri-oMg_PMTxVB5U";

function headers(extra) {
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
  }, extra || {});
}

const PRAYER_LABELS = {
  fajr: "بعد صلاة الفجر",
  dhuhr: "بعد صلاة الظهر",
  asr: "بعد صلاة العصر",
  maghrib: "بعد صلاة المغرب",
  isha: "بعد صلاة العشاء",
};

document.getElementById("timeOption").addEventListener("change", (e) => {
  document.getElementById("customTime").style.display =
    e.target.value === "custom" ? "block" : "none";
});

document.getElementById("scheduleType").addEventListener("change", (e) => {
  const isRecurring = e.target.value === "recurring";
  document.getElementById("recurringFields").style.display = isRecurring ? "block" : "none";
  document.getElementById("specificFields").style.display = isRecurring ? "none" : "block";
});

function formatArabicDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return new Intl.DateTimeFormat("ar-u-nu-latn", {
    weekday: "long", day: "numeric", month: "long",
  }).format(d);
}

function formatCustomTime(timeStr) {
  const [h, m] = timeStr.split(":").map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return "الساعة " + new Intl.DateTimeFormat("ar-u-nu-latn", {
    hour: "numeric", minute: "2-digit", hour12: true,
  }).format(d);
}

function buildScheduleText() {
  const scheduleType = document.getElementById("scheduleType").value;
  const timeOption = document.getElementById("timeOption").value;
  const location = document.getElementById("location").value.trim();
  const mapsLink = document.getElementById("mapsLink").value.trim();

  let timeText;
  if (timeOption === "custom") {
    const customVal = document.getElementById("customTime").value;
    if (!customVal) return null;
    timeText = formatCustomTime(customVal);
  } else {
    timeText = PRAYER_LABELS[timeOption];
  }

  let dateOrDayText;
  if (scheduleType === "recurring") {
    const weekday = document.getElementById("weekday").value;
    dateOrDayText = `كل يوم ${weekday}`;
  } else {
    const dateVal = document.getElementById("lessonDate").value;
    if (!dateVal) return null;
    dateOrDayText = formatArabicDate(dateVal);
  }

  if (!location) return null;

  let text = `${dateOrDayText}، ${timeText}\n   📍 ${location}`;
  if (mapsLink) text += `\n   🗺 ${mapsLink}`;
  return text;
}

function showStatus(msg, ok) {
  const box = document.getElementById("statusBox");
  box.textContent = msg;
  box.className = "status show " + (ok ? "ok" : "err");
}

async function fetchLessons() {
  const listEl = document.getElementById("lessonsList");
  listEl.innerHTML = '<div class="empty-note">جاري التحميل…</div>';
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/kalima_lessons?select=*&order=id.desc&limit=8",
      { headers: headers() }
    );
    if (!res.ok) throw new Error(await res.text());
    const rows = await res.json();
    renderLessons(rows);
  } catch (err) {
    listEl.innerHTML = '<div class="empty-note">تعذّر تحميل القائمة. تحقق من الاتصال.</div>';
    console.error(err);
  }
}

function renderLessons(rows) {
  const listEl = document.getElementById("lessonsList");
  if (!rows || rows.length === 0) {
    listEl.innerHTML = '<div class="empty-note">لا توجد دروس مسجّلة بعد.</div>';
    return;
  }
  listEl.innerHTML = "";
  rows.forEach((r) => {
    const item = document.createElement("div");
    item.className = "lesson-item";

    const info = document.createElement("div");
    info.className = "lesson-info";
    const titleEl = document.createElement("div");
    titleEl.className = "lesson-title";
    titleEl.textContent = r.title + (r.presenter ? " — " + r.presenter : "");
    const metaEl = document.createElement("div");
    metaEl.className = "lesson-meta";
    metaEl.textContent = r.schedule || "";
    info.appendChild(titleEl);
    info.appendChild(metaEl);

    const col = document.createElement("div");
    col.className = "lesson-col";
    const badge = document.createElement("span");
    badge.className = "badge " + (r.active ? "active" : "off");
    badge.textContent = r.active ? "منشور" : "متوقف";
    col.appendChild(badge);

    if (r.active) {
      const btn = document.createElement("button");
      btn.className = "deactivate-btn";
      btn.type = "button";
      btn.textContent = "إيقاف";
      btn.addEventListener("click", () => deactivateOne(r.id));
      col.appendChild(btn);
    } else {
      const btn = document.createElement("button");
      btn.className = "deactivate-btn activate-btn";
      btn.type = "button";
      btn.textContent = "تفعيل";
      btn.addEventListener("click", () => activateOne(r.id));
      col.appendChild(btn);
    }

    item.appendChild(info);
    item.appendChild(col);
    listEl.appendChild(item);
  });
}

async function deactivateOne(id) {
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/kalima_lessons?id=eq." + id,
      { method: "PATCH", headers: headers(), body: JSON.stringify({ active: false }) }
    );
    if (!res.ok) throw new Error(await res.text());
    fetchLessons();
  } catch (err) {
    showStatus("تعذّر إيقاف الدرس، حاول مرة أخرى.", false);
    console.error(err);
  }
}

async function activateOne(id) {
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/kalima_lessons?id=eq." + id,
      { method: "PATCH", headers: headers(), body: JSON.stringify({ active: true }) }
    );
    if (!res.ok) throw new Error(await res.text());
    fetchLessons();
  } catch (err) {
    showStatus("تعذّر تفعيل الدرس، حاول مرة أخرى.", false);
    console.error(err);
  }
}

document.getElementById("saveBtn").addEventListener("click", async () => {
  const title = document.getElementById("title").value.trim();
  const presenter = document.getElementById("presenter").value.trim();
  const schedule = buildScheduleText();
  const deactivateOld = document.getElementById("deactivateOld").checked;
  const btn = document.getElementById("saveBtn");

  if (!title || !schedule) {
    showStatus("يرجى تعبئة عنوان الدرس، والموعد، والمكان على الأقل.", false);
    return;
  }

  btn.disabled = true;
  btn.textContent = "جاري الحفظ…";

  try {
    if (deactivateOld) {
      const patchRes = await fetch(
        SUPABASE_URL + "/rest/v1/kalima_lessons?active=eq.true",
        { method: "PATCH", headers: headers(), body: JSON.stringify({ active: false }) }
      );
      if (!patchRes.ok) throw new Error(await patchRes.text());
    }

    const postRes = await fetch(
      SUPABASE_URL + "/rest/v1/kalima_lessons",
      {
        method: "POST",
        headers: headers({ "Prefer": "return=representation" }),
        body: JSON.stringify({
          title, presenter: presenter || null, schedule, active: true, sort_order: 1
        }),
      }
    );
    if (!postRes.ok) throw new Error(await postRes.text());

    showStatus("تم حفظ الدرس ونشره بنجاح ✅", true);
    document.getElementById("title").value = "";
    document.getElementById("presenter").value = "";
    document.getElementById("location").value = "";
    document.getElementById("mapsLink").value = "";
    document.getElementById("customTime").value = "";
    fetchLessons();
  } catch (err) {
    showStatus("حدث خطأ أثناء الحفظ، حاول مرة أخرى.", false);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.textContent = "حفظ ونشر الدرس";
  }
});

fetchLessons();
</script>
</body>
</html>
